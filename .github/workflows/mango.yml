name: ghcr publish

on:
  push:
    branches:
      - "main"

jobs:
  docker:
    name: Publish
    runs-on: ubuntu-latest
    permissions:
      packages: write # Grant write access to GHCR
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image for tests
        uses: docker/build-push-action@v4
        with:
          context: .
          push: false
          tags: ${{ github.repository_owner }}/ashortener:${{ github.sha }}

      - name: Test container locally
        run: |
          docker run --rm -d -p 3000:3000 \
            -e SITE_URL=http://localhost:3000/ \
            -e PORT=3000 \
            ${{ github.repository_owner }}/ashortener:${{ github.sha }}
          sleep 5
          wget -qO- http://localhost:3000 | grep "html"

      - name: Push to GHCR
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/ashortener:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/ashortener:latest
